<!-- ===== TT-AUTH: login gate overlay ===== -->
<div id="tt-auth-gate" style="
  position:fixed; inset:0; z-index:99999; background:#0d1520;
  display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#e8edf3;">
  <div style="width:100%; max-width:340px; padding:28px; box-sizing:border-box;">
    <h1 style="font-size:20px; font-weight:600; margin:0 0 4px;">Tasyurek Tracker</h1>
    <p id="tt-auth-sub" style="font-size:13px; color:#8ea0b3; margin:0 0 20px;">Devam etmek için giriş yap</p>

    <input id="tt-email" type="email" placeholder="E-posta" autocomplete="username"
      style="width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:15px;" />
    <input id="tt-pass" type="password" placeholder="Şifre" autocomplete="current-password"
      style="width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:14px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:15px;" />

    <button id="tt-login-btn"
      style="width:100%; padding:13px; border:none; border-radius:10px; background:#3b82f6; color:white; font-size:15px; font-weight:600; margin-bottom:10px;">Giriş yap</button>

    <p id="tt-auth-error" style="color:#f87171; font-size:13px; margin-top:14px; min-height:16px;"></p>
    <p id="tt-auth-loading" style="color:#8ea0b3; font-size:13px; margin-top:6px; display:none;">Yükleniyor...</p>
  </div>
</div>

<div id="tt-topbar" style="
  display:none; position:sticky; top:0; z-index:99998;
  padding-top: env(safe-area-inset-top, 0px);
  background:#16324f; border-bottom:1px solid #28394d;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; min-height:20px;">
    <button id="tt-switch-btn" style="
      display:none; flex:0 0 auto; background:#3b82f6; color:white; border:none;
      border-radius:8px; padding:6px 10px; font-size:12px; white-space:nowrap;">👤 Üye Değiştir</button>
    <div id="tt-edit-banner" style="
      display:none; flex:1 1 auto; min-width:0; text-align:center; color:#e3c27e;
      font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>
    <button id="tt-logout-btn" style="
      display:none; flex:0 0 auto; margin-left:auto;
      background:rgba(255,255,255,0.08); color:#8ea0b3; border:1px solid #2a3644;
      border-radius:8px; padding:6px 10px; font-size:12px; white-space:nowrap;">Çıkış</button>
  </div>
</div>

      </button>
      <button id="tt-weekly-report-btn" style="
        width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid #e3c27e;

  // ======================================================================
  // 1) BURAYI DOLDUR — Firebase Console > Project Settings > Your apps
  //    kısmından aldığın config'i buraya yapıştır.
  // ======================================================================
  var firebaseConfig = {
    apiKey: "AIzaSyCChH0sUdkOsjLOuti_kc0VPh23I9-h7a8",
    authDomain: "tasyurekmethod-tracker.firebaseapp.com",
    projectId: "tasyurekmethod-tracker",
    storageBucket: "tasyurekmethod-tracker.firebasestorage.app",
    messagingSenderId: "722567135261",
    appId: "1:722567135261:web:582e46ad856711f748c6f4"
  };

  var ADMIN_EMAIL = "mertcan.tasyurekk@gmail.com"; // sadece bu e-posta yönetici panelini görür
  var STORAGE_KEY = "tasyurek-tracker-v1"; // uygulamanın kullandığı gerçek localStorage anahtarı

  var app = initializeApp(firebaseConfig);
  var auth = getAuth(app);
  var db = getFirestore(app);

  var gate = document.getElementById('tt-auth-gate');
  var errEl = document.getElementById('tt-auth-error');
  var loadingEl = document.getElementById('tt-auth-loading');
  var emailEl = document.getElementById('tt-email');
  var passEl = document.getElementById('tt-pass');
  var topbar = document.getElementById('tt-topbar');
  var logoutBtn = document.getElementById('tt-logout-btn');
  var switchBtn = document.getElementById('tt-switch-btn');
  var editBanner = document.getElementById('tt-edit-banner');
  var picker = document.getElementById('tt-member-picker');
  var pickerLoading = document.getElementById('tt-picker-loading');
  var pickerError = document.getElementById('tt-picker-error');
  var memberListEl = document.getElementById('tt-member-list');
  var appStarted = false;
  var syncTimer = null;
  var lastSavedValue = null;
  var currentAuthUid = null;   // giriş yapan kişi
  var currentEditUid = null;   // şu an DÜZENLENEN verinin sahibi (admin başka birini seçmişse farklı olur)

  // Üst barı gösterir ve uygulama içeriğini (#root) barın YÜKSEKLİĞİ kadar
  // aşağı iter, böylece hiçbir şey durum çubuğu / bar ile çakışmaz.
  function updateTopbarLayout(){
    var anyVisible = (logoutBtn.style.display !== 'none') ||
                      (switchBtn.style.display !== 'none') ||
                      (editBanner.style.display !== 'none');
    if (anyVisible) {
      topbar.style.display = 'block';
      requestAnimationFrame(function(){
        var h = topbar.getBoundingClientRect().height;
        // picker sabit konumlu (position:fixed) olduğu için sticky topbar'ın
        // ittiği doküman akışından etkilenmez, bu yüzden onu ayrıca kaydırıyoruz.
        // #root için ekstra bir şey yapmaya gerek yok: topbar artık sticky/akış
        // içinde olduğu için #root'u zaten doğal olarak aşağı itiyor.
        picker.style.paddingTop = 'calc(env(safe-area-inset-top, 0px) + ' + h + 'px)';
      });
    } else {
      topbar.style.display = 'none';
      picker.style.paddingTop = 'env(safe-area-inset-top, 0px)';
    }
  }
  var isAdmin = false;

  function showError(msg){ errEl.textContent = msg || ""; }
  function setLoading(v){ loadingEl.style.display = v ? 'block' : 'none'; }

  // #root'u sıfırdan bir DOM node ile değiştirir (React'in eski mount izini tamamen temizler)
  function remountRootNode(){
    var oldRoot = document.getElementById('root');
    var freshRoot = document.createElement('div');
    freshRoot.id = 'root';
    oldRoot.parentNode.replaceChild(freshRoot, oldRoot);
  }

  // ===================== ÜYE İÇİN SALT-OKUNUR KISITLAMA (RBAC) =====================
  // Üye tarafında SADECE günlük loglama (kilo, makro girişi, antrenman seansı
  // kaydetme, supplement işaretleme) açık kalır. "Save targets" (makro hedefi
  // değiştirme) butonu ADMIN DIŞINDA gizlenir. Program ve supplement protokolü
  // zaten uygulama içinde düzenlenemiyor (sadece Firestore'dan admin değiştirebilir),
  // bu yüzden ekstra kilide gerek yok.
  var rbacObserver = null;
  function applyMemberRestrictions(shouldRestrict){
    if (rbacObserver) { rbacObserver.disconnect(); rbacObserver = null; }
    if (!shouldRestrict) return; // admin: hiçbir kısıtlama uygulanmaz

    function hideMacroTargetEditButton(){
      var cards = document.querySelectorAll('.tt-card');
      cards.forEach(function(card){
        var titleLead = card.querySelector('.tt-card-title-lead');
        if (titleLead && titleLead.textContent.indexOf('MACROS') !== -1) {
          var btn = card.querySelector('.tt-icon-btn');
          if (btn && btn.style.display !== 'none') {
            btn.style.display = 'none';
          }
        }
      });
    }

    hideMacroTargetEditButton();
    var rootEl = document.getElementById('root');
    if (rootEl) {
      rbacObserver = new MutationObserver(function(){ hideMacroTargetEditButton(); });
      rbacObserver.observe(rootEl, { childList: true, subtree: true });
    }
  }
  // ===================== /RBAC =====================

  // Uygulamanın gerçek kodunu ayrı dosyadan (app-bundle.js) çeker ve çalıştırır.
  // İlk çekişten sonra bellekte tutulur; Service Worker sayesinde tarayıcı
  // önbelleğinden de anında gelir. Sayfa yenilemeden tekrar tekrar
  // çağrılabilir: her seferinde #root'u temiz bir node ile değiştirip
  // bundle'ı yeniden çalıştırır.
  var bundleCodeCache = null;
  function startApp(){
    var mount = function(code){
      if (appStarted) {
        remountRootNode();
      }
      appStarted = true;
      var s = document.createElement('script');
      s.text = code;
      document.body.appendChild(s);
    };
    if (bundleCodeCache) {
      mount(bundleCodeCache);
      return;
    }
    fetch('./app-bundle.js').then(function(r){ return r.text(); }).then(function(code){
      bundleCodeCache = code;
      mount(code);
    }).catch(function(e){
      showError('Uygulama kodu yüklenemedi: ' + e.message);
    });
  }


  function showAppFor(uid, label){
    currentEditUid = uid;
    setLoading(true);
    getDoc(doc(db, 'userdata', uid)).then(function(snap){
      if (snap.exists() && snap.data().payload) {
        localStorage.setItem(STORAGE_KEY, snap.data().payload);
        lastSavedValue = snap.data().payload;
      } else {
        localStorage.removeItem(STORAGE_KEY); // farklı üyeye geçince eski veriyle karışmasın
        lastSavedValue = null;
      }
      setLoading(false);
      gate.style.display = 'none';
      picker.style.display = 'none';
      reportEl.style.display = 'none';
      logoutBtn.style.display = 'block';
      if (isAdmin) {
        switchBtn.style.display = 'block';
        editBanner.style.display = 'block';
        editBanner.textContent = 'Düzenleniyor: ' + label;
      } else {
        switchBtn.style.display = 'none';
        editBanner.style.display = 'none';
      }
      updateTopbarLayout();
      startApp();
      applyMemberRestrictions(!isAdmin);
      startSyncLoop(uid);
    }).catch(function(e){
      setLoading(false);
      showError('Veri alınamadı: ' + e.message);
    });
  }

  // Yönetici: tüm üyeleri listele
  function showMemberPicker(){
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    gate.style.display = 'none';
    picker.style.display = 'block';
    reportEl.style.display = 'none';
    logoutBtn.style.display = 'block';
    switchBtn.style.display = 'none';
    editBanner.style.display = 'none';
    updateTopbarLayout();
    pickerLoading.style.display = 'block';
    pickerError.textContent = '';
    memberListEl.innerHTML = '';
    getDocs(collection(db, 'userdata')).then(function(snap){
      pickerLoading.style.display = 'none';
      snap.forEach(function(docSnap){
        if (docSnap.id === currentAuthUid) return; // "kendi verim" butonu zaten var
        var data = docSnap.data();
        var label = data.email || docSnap.id;
        var btn = document.createElement('button');
        btn.textContent = label;
        btn.style.cssText = "width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:14px; margin-bottom:8px;";
        btn.addEventListener('click', function(){ showAppFor(docSnap.id, label); });
        memberListEl.appendChild(btn);
      });
      if (memberListEl.children.length === 0) {
        var p = document.createElement('p');
        p.style.cssText = "font-size:13px; color:#8ea0b3;";
        p.textContent = "Henüz hiç üye giriş yapmadı. Bir üye ilk kez giriş yaptığında burada görünecek.";
        memberListEl.appendChild(p);
      }
    }).catch(function(e){
      pickerLoading.style.display = 'none';
      pickerError.textContent = 'Üyeler alınamadı: ' + e.message;
    });
  }

  // Değişiklikleri periyodik olarak Firestore'a yazar (currentEditUid'e yazar)
  function startSyncLoop(uid){
    function syncNow(){
      var current = localStorage.getItem(STORAGE_KEY);
      if (current && current !== lastSavedValue) {
        lastSavedValue = current;
        setDoc(doc(db, 'userdata', uid), {
          payload: current,
          updatedAt: serverTimestamp()
        }, { merge: true }).catch(function(e){ console.error('sync error', e); });
      }
    }
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(syncNow, 4000);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') syncNow();
    });
    window.addEventListener('beforeunload', syncNow);
  }

  // ===================== HAFTALIK RAPOR =====================
  var reportEl = document.getElementById('tt-weekly-report');
  var reportLoadingEl = document.getElementById('tt-report-loading');
  var reportErrorEl = document.getElementById('tt-report-error');
  var reportListEl = document.getElementById('tt-report-list');

  function fmtDate(d){
    var p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }

  // Son 7 günün (bugün dahil) tarih string listesini üretir: ["2026-09-01", ...]
  function last7Dates(){
    var out = [];
    var today = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      out.push(fmtDate(d));
    }
    return out;
  }

  // Bir üyenin payload'undan haftalık özet çıkarır
  function computeWeeklyStats(payloadStr){
    var data;
    try { data = JSON.parse(payloadStr); } catch(e) { return null; }
    var week = last7Dates();
    var daily = data.daily || {};
    var targets = data.targets || {};
    var workouts = data.workouts || [];
    var measurements = data.measurements || [];

    var loggedDays = 0;
    var macroPctSum = 0, macroPctCount = 0;
    var suppPctSum = 0, suppPctCount = 0;
    var latestWeight = null, weightDate = null;

    week.forEach(function(dateStr){
      var d = daily[dateStr];
      if (!d) return;
      loggedDays++;
      if (d.weight) { latestWeight = d.weight; weightDate = dateStr; }
      // makro uyumu: protein/carbs/fat'ın hedefe oranı, 100%'de tavanlanır, ortalaması alınır
      ['protein','carbs','fat'].forEach(function(k){
        var val = parseFloat(d[k]);
        var target = parseFloat(targets[k]);
        if (!isNaN(val) && target > 0) {
          macroPctSum += Math.min(val / target, 1.2); // %120'ye kadar tavan (aşırı sapmayı da göster ama sınırla)
          macroPctCount++;
        }
      });
      if (d.supplements && typeof d.supplements === 'object') {
        var keys = Object.keys(d.supplements);
        if (keys.length) {
          var taken = keys.filter(function(k){ return d.supplements[k]; }).length;
          suppPctSum += taken / keys.length;
          suppPctCount++;
        }
      }
    });

    // Eğer bu hafta hiç kilo girilmemişse, en son ölçüm kaydından bak
    if (latestWeight == null && measurements.length) {
      var last = measurements[measurements.length - 1];
      latestWeight = last.weight; weightDate = last.date;
    }

    var workoutsThisWeek = workouts.filter(function(w){
      return week.indexOf(w.date) !== -1;
    }).length;

    return {
      loggedDays: loggedDays,
      totalDays: 7,
      macroAdherencePct: macroPctCount ? Math.round((macroPctSum / macroPctCount) * 100) : null,
      supplementAdherencePct: suppPctCount ? Math.round((suppPctSum / suppPctCount) * 100) : null,
      workoutsThisWeek: workoutsThisWeek,
      latestWeight: latestWeight,
      weightDate: weightDate,
      hasProgram: Array.isArray(data.programs) && data.programs.length > 0
    };
  }

  function renderReportRow(label, stats){
    var row = document.createElement('div');
    row.style.cssText = "border:1px solid #2a3644; background:#141d29; border-radius:10px; padding:14px; margin-bottom:10px;";
    if (!stats) {
      row.innerHTML = '<div style="font-weight:600; font-size:14px; margin-bottom:4px;">' + label + '</div>' +
        '<div style="font-size:12px; color:#8ea0b3;">Veri okunamadı</div>';
      row.appendChild;
      reportListEl.appendChild(row);
      return;
    }
    var macroTxt = stats.macroAdherencePct == null ? '—' : stats.macroAdherencePct + '%';
    var suppTxt = stats.supplementAdherencePct == null ? '—' : stats.supplementAdherencePct + '%';
    var weightTxt = stats.latestWeight ? (stats.latestWeight + ' kg' + (stats.weightDate ? ' (' + stats.weightDate + ')' : '')) : '—';
    row.innerHTML =
      '<div style="font-weight:600; font-size:14px; margin-bottom:8px;">' + label + '</div>' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12px; color:#c7d2dd;">' +
        '<div>📅 Log günü: <b>' + stats.loggedDays + '/' + stats.totalDays + '</b></div>' +
        '<div>🏋️ Antrenman: <b>' + stats.workoutsThisWeek + '</b></div>' +
        '<div>🍽️ Makro uyumu: <b>' + macroTxt + '</b></div>' +
        '<div>💊 Supplement: <b>' + suppTxt + '</b></div>' +
        '<div>⚖️ Son kilo: <b>' + weightTxt + '</b></div>' +
        '<div>📋 Program: <b>' + (stats.hasProgram ? 'Var' : 'Yok') + '</b></div>' +
      '</div>';
    reportListEl.appendChild(row);
  }

  function showWeeklyReport(){
    picker.style.display = 'none';
    reportEl.style.display = 'block';
    reportLoadingEl.style.display = 'block';
    reportErrorEl.textContent = '';
    reportListEl.innerHTML = '';
    getDocs(collection(db, 'userdata')).then(function(snap){
      reportLoadingEl.style.display = 'none';
      var docs = [];
      snap.forEach(function(d){ docs.push(d); });
      if (docs.length === 0) {
        reportListEl.innerHTML = '<p style="font-size:13px; color:#8ea0b3;">Henüz üye yok.</p>';
        return;
      }
      docs.forEach(function(docSnap){
        var data = docSnap.data();
        var label = data.email || docSnap.id;
        if (!data.payload) {
          renderReportRow(label, null);
          return;
        }
        renderReportRow(label, computeWeeklyStats(data.payload));
      });
    }).catch(function(e){
      reportLoadingEl.style.display = 'none';
      reportErrorEl.textContent = 'Rapor alınamadı: ' + e.message;
    });
  }

  document.getElementById('tt-weekly-report-btn').addEventListener('click', showWeeklyReport);
  document.getElementById('tt-report-back-btn').addEventListener('click', function(){
    reportEl.style.display = 'none';
    picker.style.display = 'block';
  });
  // ===================== /HAFTALIK RAPOR =====================

  document.getElementById('tt-login-btn').addEventListener('click', function(){
    showError('');
    signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value)
      .catch(function(e){ showError(e.message); });
  });

  document.getElementById('tt-own-data-btn').addEventListener('click', function(){
    showAppFor(currentAuthUid, auth.currentUser.email + ' (kendi verin)');
  });

  // Üye Değiştir: mevcut veriyi kaydet, hemen picker'ı göster (sayfa yenileme YOK)
  switchBtn.addEventListener('click', function(){
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    var current = localStorage.getItem(STORAGE_KEY);
    var savePromise = Promise.resolve();
    if (current && currentEditUid) {
      savePromise = setDoc(doc(db, 'userdata', currentEditUid), {
        payload: current, updatedAt: serverTimestamp()
      }, { merge: true }).catch(function(){});
    }
    savePromise.then(showMemberPicker);
  });

  // Çıkış: mevcut veriyi kaydet, oturumu kapat, giriş ekranını göster (sayfa yenileme YOK)
  logoutBtn.addEventListener('click', function(){
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    var current = localStorage.getItem(STORAGE_KEY);
    var uid = currentEditUid;
    var savePromise = Promise.resolve();
    if (uid && current) {
      savePromise = setDoc(doc(db, 'userdata', uid), {
        payload: current, updatedAt: serverTimestamp()
      }, { merge: true }).catch(function(){});
    }
    savePromise.then(function(){ return signOut(auth); }).then(function(){
      appStarted = false;
      remountRootNode();
      currentEditUid = null;
      emailEl.value = '';
      passEl.value = '';
      gate.style.display = 'flex';
      picker.style.display = 'none';
      reportEl.style.display = 'none';
      logoutBtn.style.display = 'none';
      switchBtn.style.display = 'none';
      editBanner.style.display = 'none';
      updateTopbarLayout();
    });
  });

  var handledUid = null; // hangi kullanıcı için zaten showAppFor/showMemberPicker çalıştırıldı

  onAuthStateChanged(auth, function(user){
    if (user) {
      currentAuthUid = user.uid;
      isAdmin = (user.email === ADMIN_EMAIL);

      // onAuthStateChanged, aynı oturumda (token yenileme, sekme odaklanma vb.
      // nedenlerle) birden fazla kez tetiklenebilir. Aynı kullanıcı için
      // veriyi tekrar tekrar çekip uygulamayı sıfırlamamak için, sadece
      // GERÇEKTEN yeni bir girişte tam akışı çalıştırıyoruz.
      if (handledUid === user.uid) {
        return; // zaten bu kullanıcının verisiyle çalışıyoruz, hiçbir şey yapma
      }
      handledUid = user.uid;

      // Her giriş yapan, kendi belgesinde kayıtlı olsun (admin panosunda görünmesi için)
      setDoc(doc(db, 'userdata', user.uid), { email: user.email }, { merge: true });

      if (isAdmin) {
        showMemberPicker();
      } else {
        showAppFor(user.uid, user.email);
      }
    } else {
      handledUid = null;
      gate.style.display = 'flex';
      picker.style.display = 'none';
      reportEl.style.display = 'none';
      logoutBtn.style.display = 'none';
      switchBtn.style.display = 'none';
      editBanner.style.display = 'none';
      updateTopbarLayout();
    }
  });
})();
</script>



<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){
        console.warn('SW kayıt hatası:', e);
      });
    });
  }
</script>
