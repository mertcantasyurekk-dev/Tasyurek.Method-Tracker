<!-- ===== TT-AUTH: login gate overlay ===== -->
<div id="tt-auth-gate" style="
  position:fixed; inset:0; z-index:99999; background:#0d1520;
  display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#e8edf3;">
  <div style="width:100%; max-width:340px; padding:28px; box-sizing:border-box;">
    <h1 style="font-size:20px; font-weight:600; margin:0 0 4px;">Tasyurek Tracker</h1>
    <p id="tt-auth-sub" style="font-size:13px; color:#8ea0b3; margin:0 0 20px;">Devam etmek için giriş yap</p>

    <input id="tt-email" type="email" placeholder="E-posta" autocomplete="username"
      style="width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:15px;" />
    <input id="tt-pass" type="password" placeholder="Şifre" autocomplete="current-password"
      style="width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:14px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:15px;" />

    <button id="tt-login-btn"
      style="width:100%; padding:13px; border:none; border-radius:10px; background:#3b82f6; color:white; font-size:15px; font-weight:600; margin-bottom:10px;">Giriş yap</button>

    <p id="tt-auth-error" style="color:#f87171; font-size:13px; margin-top:14px; min-height:16px;"></p>
    <p id="tt-auth-loading" style="color:#8ea0b3; font-size:13px; margin-top:6px; display:none;">Yükleniyor...</p>
  </div>
</div>

<button id="tt-logout-btn" style="
  display:none; position:fixed; top:8px; right:8px; z-index:99998;
  background:rgba(20,29,41,0.85); color:#8ea0b3; border:1px solid #2a3644;
  border-radius:8px; padding:6px 10px; font-size:12px; font-family:-apple-system,sans-serif;">Çıkış</button>

<button id="tt-switch-btn" style="
  display:none; position:fixed; top:8px; left:8px; z-index:99998;
  background:rgba(59,130,246,0.9); color:white; border:none;
  border-radius:8px; padding:6px 10px; font-size:12px; font-family:-apple-system,sans-serif;">👤 Üye Değiştir</button>

<div id="tt-edit-banner" style="
  display:none; position:fixed; top:0; left:0; right:0; z-index:99997;
  background:#f59e0b; color:#1a1200; text-align:center; font-size:12px;
  font-family:-apple-system,sans-serif; padding:4px 60px;"></div>

<!-- ===== TT-AUTH: admin member picker ===== -->
<div id="tt-member-picker" style="
  display:none; position:fixed; inset:0; z-index:99996; background:#0d1520;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#e8edf3; overflow-y:auto;">
  <div style="max-width:420px; margin:0 auto; padding:28px 20px;">
    <h1 style="font-size:20px; font-weight:600; margin:0 0 4px;">Yönetici Paneli</h1>
    <p style="font-size:13px; color:#8ea0b3; margin:0 0 20px;">Düzenlemek istediğin üyeyi seç</p>
    <div style="margin-bottom:14px;">
      <button id="tt-own-data-btn" style="
        width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid #3b82f6;
        background:rgba(59,130,246,0.15); color:#e8edf3; font-size:14px; margin-bottom:8px;">
        ⭐ Kendi verim (koç)
      </button>
    </div>
    <p id="tt-picker-loading" style="font-size:13px; color:#8ea0b3;">Üyeler yükleniyor...</p>
    <div id="tt-member-list"></div>
    <p id="tt-picker-error" style="color:#f87171; font-size:13px; margin-top:14px;"></p>
  </div>
</div>

    var freshRoot = document.createElement('div');
    freshRoot.id = 'root';
    oldRoot.parentNode.replaceChild(freshRoot, oldRoot);
  }

  // Uygulamanın gerçek kodunu çalıştırır. Sayfa yenilemeden tekrar tekrar
  // çağrılabilir: her seferinde #root'u temiz bir node ile değiştirip
  // bundle'ı yeniden çalıştırır (Firebase kütüphaneleri zaten tarayıcı
  // tarafından önbelleğe alınmış modüller olduğu için tekrar indirilmez).
  function startApp(){
    if (appStarted) {
      remountRootNode();
    }
    appStarted = true;
    var inert = document.getElementById('tt-app-bundle');
    var s = document.createElement('script');
    s.text = inert.textContent;
    document.body.appendChild(s);
  }

  function showAppFor(uid, label){
    currentEditUid = uid;
    setLoading(true);
    getDoc(doc(db, 'userdata', uid)).then(function(snap){
      if (snap.exists() && snap.data().payload) {
        localStorage.setItem(STORAGE_KEY, snap.data().payload);
        lastSavedValue = snap.data().payload;
      } else {
        localStorage.removeItem(STORAGE_KEY); // farklı üyeye geçince eski veriyle karışmasın
        lastSavedValue = null;
      }
      setLoading(false);
      gate.style.display = 'none';
      picker.style.display = 'none';
      logoutBtn.style.display = 'block';
      if (isAdmin) {
        switchBtn.style.display = 'block';
        editBanner.style.display = 'block';
        editBanner.textContent = 'Düzenleniyor: ' + label;
      }
      startApp();
      startSyncLoop(uid);
    }).catch(function(e){
      setLoading(false);
      showError('Veri alınamadı: ' + e.message);
    });
  }

  // Yönetici: tüm üyeleri listele
  function showMemberPicker(){
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    gate.style.display = 'none';
    picker.style.display = 'block';
    logoutBtn.style.display = 'block';
    switchBtn.style.display = 'none';
    editBanner.style.display = 'none';
    pickerLoading.style.display = 'block';
    pickerError.textContent = '';
    memberListEl.innerHTML = '';
    getDocs(collection(db, 'userdata')).then(function(snap){
      pickerLoading.style.display = 'none';
      snap.forEach(function(docSnap){
        if (docSnap.id === currentAuthUid) return; // "kendi verim" butonu zaten var
        var data = docSnap.data();
        var label = data.email || docSnap.id;
        var btn = document.createElement('button');
        btn.textContent = label;
        btn.style.cssText = "width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:14px; margin-bottom:8px;";
        btn.addEventListener('click', function(){ showAppFor(docSnap.id, label); });
        memberListEl.appendChild(btn);
      });
      if (memberListEl.children.length === 0) {
        var p = document.createElement('p');
        p.style.cssText = "font-size:13px; color:#8ea0b3;";
        p.textContent = "Henüz hiç üye giriş yapmadı. Bir üye ilk kez giriş yaptığında burada görünecek.";
        memberListEl.appendChild(p);
      }
    }).catch(function(e){
      pickerLoading.style.display = 'none';
      pickerError.textContent = 'Üyeler alınamadı: ' + e.message;
    });
  }

  // Değişiklikleri periyodik olarak Firestore'a yazar (currentEditUid'e yazar)
  function startSyncLoop(uid){
    function syncNow(){
      var current = localStorage.getItem(STORAGE_KEY);
      if (current && current !== lastSavedValue) {
        lastSavedValue = current;
        setDoc(doc(db, 'userdata', uid), {
          payload: current,
          updatedAt: serverTimestamp()
        }, { merge: true }).catch(function(e){ console.error('sync error', e); });
      }
    }
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(syncNow, 4000);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') syncNow();
    });
    window.addEventListener('beforeunload', syncNow);
  }

  document.getElementById('tt-login-btn').addEventListener('click', function(){
    showError('');
    signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value)
      .catch(function(e){ showError(e.message); });
  });

  document.getElementById('tt-own-data-btn').addEventListener('click', function(){
    showAppFor(currentAuthUid, auth.currentUser.email + ' (kendi verin)');
  });

  // Üye Değiştir: mevcut veriyi kaydet, hemen picker'ı göster (sayfa yenileme YOK)
  switchBtn.addEventListener('click', function(){
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    var current = localStorage.getItem(STORAGE_KEY);
    var savePromise = Promise.resolve();
    if (current && currentEditUid) {
      savePromise = setDoc(doc(db, 'userdata', currentEditUid), {
        payload: current, updatedAt: serverTimestamp()
      }, { merge: true }).catch(function(){});
    }
    savePromise.then(showMemberPicker);
  });

  // Çıkış: mevcut veriyi kaydet, oturumu kapat, giriş ekranını göster (sayfa yenileme YOK)
  logoutBtn.addEventListener('click', function(){
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    var current = localStorage.getItem(STORAGE_KEY);
    var uid = currentEditUid;
    var savePromise = Promise.resolve();
    if (uid && current) {
      savePromise = setDoc(doc(db, 'userdata', uid), {
        payload: current, updatedAt: serverTimestamp()
      }, { merge: true }).catch(function(){});
    }
    savePromise.then(function(){ return signOut(auth); }).then(function(){
      appStarted = false;
      remountRootNode();
      currentEditUid = null;
      emailEl.value = '';
      passEl.value = '';
      gate.style.display = 'flex';
      picker.style.display = 'none';
      logoutBtn.style.display = 'none';
      switchBtn.style.display = 'none';
      editBanner.style.display = 'none';
    });
  });

  onAuthStateChanged(auth, function(user){
    if (user) {
      currentAuthUid = user.uid;
      isAdmin = (user.email === ADMIN_EMAIL);
      // Her giriş yapan, kendi belgesinde kayıtlı olsun (admin panosunda görünmesi için)
      setDoc(doc(db, 'userdata', user.uid), { email: user.email }, { merge: true });

      if (isAdmin) {
        showMemberPicker();
      } else {
        showAppFor(user.uid, user.email);
      }
    } else {
      gate.style.display = 'flex';
      picker.style.display = 'none';
      logoutBtn.style.display = 'none';
      switchBtn.style.display = 'none';
      editBanner.style.display = 'none';
    }
  });
})();
</script>

:root {
  --bg: #0d1520;
  --surface: #15202e;
  --surface-2: #1b2a3b;
  --line: #28394d;
  --text: #edf1f5;
  --muted: #8ea0b3;
  --navy: #16324f;
  --navy-light: #2c557f;
  --gold: #b8863c;
  --gold-dim: #4a3a20;
  --gold-light: #e3c27e;
  --cream: #fbf6ec;
  --lime: #c8f24e;
  --ember: #ff7a45;
  --ember-dim: #5a3626;
  --blue: #6fb3ff;
  --amber: #f2c14e;
  --red: #ff5a5a;
}
.tt-app { background: var(--bg); color: var(--text); font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
  min-height: 100%; padding: 0 0 32px 0; max-width: 640px; margin: 0 auto; }
.tt-app * { box-sizing: border-box; min-width: 0; overflow-wrap: anywhere; }
.tt-app { overflow-x: hidden; }
.tt-num { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; }
.tt-stamp { padding: 16px 16px 0; }
.tt-stamp-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tt-stamp-brand { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 0.02em; margin: 0; }
.tt-stamp-tagline { font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--gold-light);
  text-transform: uppercase; margin: 3px 0 0; }
.tt-stamp-doc { text-align: right; }
.tt-stamp-doc-name { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--gold);
  text-transform: uppercase; margin: 0; }
.tt-stamp-doc-sub { font-size: 11px; color: var(--muted); margin: 3px 0 0; }
.tt-stamp-rule { height: 2.5px; background: var(--navy); border-radius: 2px; margin: 12px 0 0;
  box-shadow: 0 0 0 1px var(--gold-dim) inset; }
.tt-footer { text-align: center; font-size: 10.5px; color: var(--muted); letter-spacing: 0.03em;
  padding: 22px 16px 10px; }
.tt-header { padding: 20px 18px 12px; }
.tt-title { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-size: 13px; letter-spacing: 0.08em;
  color: var(--muted); text-transform: uppercase; margin: 0 0 2px; }
.tt-sub { font-size: 22px; font-weight: 600; margin: 0; }
.tt-nav { display: flex; gap: 6px; padding: 0 14px 14px; }
.tt-navbtn { flex: 1; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex;
  align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all .15s; }
.tt-navbtn.active { background: var(--gold); color: #1a1206; border-color: var(--gold); }
.tt-main { padding: 0 14px; }
.tt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; margin-bottom: 12px; }
.tt-card-title { font-size: 12px; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px;
  display: flex; align-items: center; gap: 6px; font-weight: 600; justify-content: space-between; }
.tt-card-title-lead { display: flex; align-items: center; gap: 6px; }
.tt-row { display: flex; gap: 10px; }
.tt-field { flex: 1; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.tt-field label { font-size: 11px; color: var(--muted); }
.tt-field input, .tt-field select { background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 15px; width: 100%;
  font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; }
.tt-field input:focus, .tt-field select:focus { outline: none; border-color: var(--gold); }
.tt-btn { background: var(--gold); color: #1a1206; border: none; border-radius: 9px; padding: 11px 16px;
  font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center;
  gap: 6px; justify-content: center; }
.tt-btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.tt-btn.ember { background: var(--ember); color: #2b1206; }
.tt-btn.sm { padding: 7px 11px; font-size: 12px; }
.tt-btn.full { width: 100%; }
.tt-btn:disabled { opacity: .4; cursor: default; }
.tt-icon-btn { background: transparent; border: none; color: var(--muted); cursor: pointer;
  padding: 4px; display: flex; }
.tt-icon-btn:hover { color: var(--text); }
.tt-statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.tt-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 10px; }
.tt-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tt-stat-val { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-size: 20px; font-weight: 700; margin-top: 3px; }
.tt-stat-delta { font-size: 11px; margin-top: 2px; }
.tt-bar-track { background: var(--surface-2); border-radius: 6px; height: 8px; overflow: hidden;
  margin-top: 4px; }
.tt-bar-fill { height: 100%; border-radius: 6px; }
.tt-macrorow { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; font-size: 12px; color: var(--muted);
  margin-top: 6px; }
.tt-cardio-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.tt-cardio-row input, .tt-cardio-row select { background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 8px 9px; font-size: 13px; width: 100%; }
.tt-set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.tt-set-row input { background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 8px 9px; font-size: 14px; width: 100%; font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; }
.tt-set-idx { font-size: 11px; color: var(--muted); width: 18px; text-align: center; flex-shrink: 0; }
.tt-exercise-block { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 10px; background: var(--surface-2); }
.tt-exercise-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tt-exercise-name { font-weight: 700; font-size: 14px; }
.tt-hint { font-size: 11px; color: var(--gold-light); margin-bottom: 4px; }
.tt-hint.target { color: var(--blue); }
.tt-hint.note { color: #4a3e28; font-style: normal; background: var(--cream); border-left: 3px solid var(--gold);
  padding: 6px 8px; border-radius: 4px; margin-bottom: 6px; }
.tt-badge-up { display: inline-flex; align-items: center; gap: 5px; background: rgba(184,134,60,0.16);
  color: var(--gold-light); border: 1px solid var(--gold-dim); padding: 5px 9px; border-radius: 7px;
  font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.tt-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 22px 8px; }
.tt-session-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px;
  background: var(--surface-2); cursor: pointer; }
.tt-session-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tt-session-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-session-head > div:first-child { min-width: 0; flex: 1; }
.tt-session-date { font-size: 11px; color: var(--muted); }
.tt-pill { display: inline-block; background: var(--surface); border: 1px solid var(--line);
  color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 11px; margin-right: 4px; }
.tt-day-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.tt-daybtn { background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.tt-daybtn-sub { display: block; font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.tt-daybtn:hover { border-color: var(--gold); }
.tt-mobility-toggle { font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px; }
.tt-mobility-list { font-size: 12px; color: var(--muted); margin: 8px 0 0; padding-left: 16px; }
.tt-range-row { display: flex; gap: 6px; margin-bottom: 12px; }
.tt-rangebtn { flex: 1; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  padding: 7px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
.tt-rangebtn.active { background: var(--surface-2); color: var(--gold-light); border-color: var(--gold); }
.tt-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.tt-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px;
  border-bottom: 1px solid var(--line); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.tt-table td { padding: 7px 4px; border-bottom: 1px solid var(--line); font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; }
.tt-table-wrap { overflow-x: auto; }
.tt-mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.tt-supp-group-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--gold-light); margin: 14px 0 6px; }
.tt-supp-group-label:first-child { margin-top: 0; }
.tt-supp-row { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
.tt-supp-row:last-child { border-bottom: none; }
.tt-supp-check { flex-shrink: 0; margin-top: 1px; color: var(--muted); }
.tt-supp-row.checked .tt-supp-check { color: var(--gold); }
.tt-supp-name { font-size: 13px; font-weight: 700; }
.tt-supp-row.checked .tt-supp-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tt-supp-dose { font-size: 11px; color: var(--muted); margin-top: 1px; }
.tt-supp-effect { font-size: 10.5px; color: var(--gold-light); margin-top: 1px; }
.tt-loading { display: flex; align-items: center; justify-content: center; height: 240px; color: var(--muted); }
