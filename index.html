<!-- ===== Apple/iOS tarzı görsel yenileme =====
     Marka renkleri (lacivert/gold) ve tüm mantık/kod AYNI kalıyor;
     sadece tipografi, köşe yuvarlaklığı, derinlik ve dokunma geri
     bildirimi iOS'a daha yakın hissettirilecek şekilde güncellendi. -->
<style>
  .tt-app, .tt-num, .tt-stat-val,
  .tt-field input, .tt-field select, .tt-set-row input, .tt-cardio-row input, .tt-cardio-row select {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  }

  /* ===== PREMIUM DOKUNUŞLAR (Apple seviyesi cam/derinlik/tipografi) ===== */

  /* Kartlar: saydam lacivert cam (navy glass) + ışık yansıması (specular
     border) + squircle benzeri yumuşak köşe (gerçek CSS squircle henüz
     Safari'de desteklenmiyor, geniş border-radius ile yaklaşıyoruz) */
  .tt-card, .tt-stat {
    background: rgba(22, 50, 79, 0.72) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
    backdrop-filter: blur(20px) saturate(160%) !important;
    border-radius: 22px !important;
    border-top: 1px solid rgba(255,255,255,0.15) !important;
    border-left: 1px solid rgba(255,255,255,0.06) !important;
    border-right: 1px solid rgba(255,255,255,0.06) !important;
    border-bottom: 1px solid rgba(0,0,0,0.2) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28) !important;
    transition: transform .2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .2s ease;
  }

  /* Kicker/etiket tipografisi: UPPERCASE + geniş harf aralığı + açık altın */
  .tt-card-title, .tt-stamp-tagline {
    letter-spacing: 0.18em !important;
    color: #e3c27e !important;
  }

  /* Altın vurgusu SADECE mikro dokunuşlarda: aktif sekme, başlık altı çizgi */
  .tt-stamp-brand { text-shadow: 0 0 18px rgba(184,134,48,0.0); }

  /* Yay fiziği (spring): tüm tıklanabilir yüzeylerde esnek küçülme/geri dönüş */
  .tt-card:active, .tt-stat:active {
    transform: scale(0.985);
  }

  /* Sekme çubuğu: iOS segmented control görünümü */
  .tt-nav {
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 4px;
    gap: 4px !important;
  }
  .tt-navbtn {
    border-radius: 11px !important;
    border: none !important;
    background: transparent !important;
    transition: background .18s ease, color .18s ease, transform .1s ease;
  }
  .tt-navbtn.active {
    box-shadow: 0 1px 4px rgba(0,0,0,0.35) !important;
  }
  .tt-navbtn:active { transform: scale(0.96); }

  /* Bizim kendi 2x2 sekme kopyamız (Today/Train/Progress/Yemek): uygulamanın
     kayan gösterge efekti burada olmadığı için kendi net "seçili" stilimizi
     tanımlıyoruz. */
  .tt-own-nav-grid button {
    color: #8ea0b3 !important;
    background: transparent !important;
    padding: 11px 8px !important;
    font-weight: 600;
  }
  .tt-own-nav-grid button.active {
    background: #b8863c !important;
    color: #0d1520 !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35) !important;
  }

  /* Butonlar: squircle köşe + yay fiziği (spring) ile bastıkça esnek küçülme */
  .tt-btn {
    border-radius: 15px !important;
    transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .15s ease;
    letter-spacing: 0.01em;
  }
  .tt-btn:active:not(:disabled) { transform: scale(0.96); opacity: 0.9; }
  .tt-btn.ghost { border-color: rgba(255,255,255,0.14) !important; }

  /* Giriş alanları: iOS'un içe gömük (inset) his veren yuvarlak kutuları */
  .tt-field input, .tt-field select,
  .tt-set-row input, .tt-cardio-row input, .tt-cardio-row select {
    border-radius: 12px !important;
    border-color: rgba(255,255,255,0.08) !important;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tt-field input:focus, .tt-field select:focus {
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.25), 0 0 0 3px rgba(184,134,60,0.25) !important;
  }

  /* İkon butonları: dokunma geri bildirimi */
  .tt-icon-btn { border-radius: 8px; transition: background .15s ease; }
  .tt-icon-btn:active { transform: scale(0.92); }

  /* İlerleme çubukları: biraz daha yumuşak ve akıcı */
  .tt-bar-track { border-radius: 8px !important; }
  .tt-bar-fill { border-radius: 8px !important; transition: width .3s ease; }

  /* Egzersiz blokları: kartlarla uyumlu köşe yuvarlaklığı */
  .tt-exercise-block { border-radius: 14px !important; border-color: rgba(255,255,255,0.06) !important; }

  /* Genel: yumuşak kayma/kaybolma hissi için */
  .tt-app * { -webkit-tap-highlight-color: transparent; }

  /* Bizim eklediğimiz ekranlar (giriş, admin panel, yemek takibi) da
     aynı cam/squircle/yay dilini kullansın: */
  #tt-member-picker > div > button, #tt-weekly-report .tt-card,
  #tt-auth-gate input,
  .tt-meal-section, .tt-meal-search-item, .tt-meal-entry-row,
  #tt-switch-btn, #tt-logout-btn {
    border-radius: 18px !important;
  }
  .tt-meal-section, #tt-member-picker > div > button {
    background: rgba(22, 50, 79, 0.72) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
    backdrop-filter: blur(20px) saturate(160%) !important;
    border-top: 1px solid rgba(255,255,255,0.15) !important;
    border-bottom: 1px solid rgba(0,0,0,0.2) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.24) !important;
  }
  #tt-own-data-btn, #tt-weekly-report-btn, #tt-login-btn,
  #tt-switch-btn, #tt-logout-btn, .tt-meal-add-btn, .tt-meal-custom-toggle,
  #tt-copy-yesterday-btn, #tt-quick-water-btn {
    border-radius: 15px !important;
    transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .15s ease !important;
  }
  #tt-login-btn:active, #tt-own-data-btn:active, #tt-weekly-report-btn:active,
  #tt-switch-btn:active, #tt-logout-btn:active,
  .tt-meal-search-item:active, #tt-meal-add-btn:active,
  #tt-member-picker > div > button:active,

  // ---------------- Firestore değer kodlama/kod açma ----------------
  function encodeValue(v){
    if (v === null || v === undefined) return { nullValue: null };
    if (typeof v === 'string') return { stringValue: v };
    if (typeof v === 'boolean') return { booleanValue: v };
    if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    if (Array.isArray(v)) return { arrayValue: { values: v.map(encodeValue) } };
    if (typeof v === 'object') {
      var fields = {};
      Object.keys(v).forEach(function(k){ fields[k] = encodeValue(v[k]); });
      return { mapValue: { fields: fields } };
    }
    return { nullValue: null };
  }
  function decodeValue(fv){
    if (!fv) return null;
    if ('stringValue' in fv) return fv.stringValue;
    if ('integerValue' in fv) return parseInt(fv.integerValue, 10);
    if ('doubleValue' in fv) return fv.doubleValue;
    if ('booleanValue' in fv) return fv.booleanValue;
    if ('nullValue' in fv) return null;
    if ('timestampValue' in fv) return fv.timestampValue;
    if ('arrayValue' in fv) return (fv.arrayValue.values || []).map(decodeValue);
    if ('mapValue' in fv) {
      var out = {};
      var f = fv.mapValue.fields || {};
      Object.keys(f).forEach(function(k){ out[k] = decodeValue(f[k]); });
      return out;
    }
    return null;
  }
  function decodeDoc(docJson){
    var out = {};
    var f = docJson.fields || {};
    Object.keys(f).forEach(function(k){ out[k] = decodeValue(f[k]); });
    return out;
  }

  async function signInWithPasswordREST(email, password){
    var res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password, returnSecureToken: true })
    });
    var data = await res.json();
    if (!res.ok) {
      var msg = (data.error && data.error.message) || 'Giriş başarısız';
      throw new Error(msg);
    }
    authState = {
      idToken: data.idToken,
      refreshToken: data.refreshToken,
      uid: data.localId,
      email: email,
      obtainedAt: Date.now(),
      expiresIn: parseInt(data.expiresIn, 10) || 3600
    };
    saveAuthState();
    return authState;
  }

  async function ensureFreshToken(){
    if (!authState.idToken || !authState.refreshToken) throw new Error('Oturum yok');
    var ageSec = (Date.now() - authState.obtainedAt) / 1000;
    if (ageSec > (authState.expiresIn - 300)) { // süresi dolmadan ~5dk önce yenile
      var res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(authState.refreshToken)
      });
      var data = await res.json();
      if (!res.ok) { clearAuthState(); throw new Error('Oturum yenilenemedi'); }
      authState.idToken = data.id_token;
      authState.refreshToken = data.refresh_token;
      authState.expiresIn = parseInt(data.expires_in, 10) || 3600;
      authState.obtainedAt = Date.now();
      saveAuthState();
    }
    return authState.idToken;
  }

  // ---------------- Firestore (REST) ----------------
  async function fsGetDocByPath(path){
    var token = await ensureFreshToken();
    var res = await fetch(FS_BASE + '/' + path, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.status === 404) return { exists: false, data: null };
    var data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || 'Firestore okuma hatası');
    return { exists: true, data: decodeDoc(data) };
  }

  async function fsSetDocMergeByPath(path, fieldsObj){
    var token = await ensureFreshToken();
    var fieldNames = Object.keys(fieldsObj);
    var maskParams = fieldNames.map(function(f){ return 'updateMask.fieldPaths=' + encodeURIComponent(f); }).join('&');
    var body = { fields: {} };
    fieldNames.forEach(function(k){ body.fields[k] = encodeValue(fieldsObj[k]); });
    var res = await fetch(FS_BASE + '/' + path + '?' + maskParams, {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || 'Firestore yazma hatası');
    return data;
  }

  function fsGetDoc(uid){ return fsGetDocByPath('userdata/' + uid); }
  function fsSetDocMerge(uid, fieldsObj){ return fsSetDocMergeByPath('userdata/' + uid, fieldsObj); }

  async function fsListCollection(name){
    var token = await ensureFreshToken();
    var res = await fetch(FS_BASE + ':runQuery', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        structuredQuery: { from: [{ collectionId: name }] }
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || (Array.isArray(data) && data[0] && data[0].error && data[0].error.message) || 'Firestore liste hatası');
    if (!Array.isArray(data)) throw new Error('Beklenmeyen liste yanıtı');
    var out = [];
    data.forEach(function(item){
      if (!item.document) return; // sadece "heartbeat" satırı, belge yok
      var idParts = item.document.name.split('/');
      var id = idParts[idParts.length - 1];
      out.push({ id: id, data: decodeDoc(item.document) });
    });
    return out;
  }

  // ---------------- Basit SVG grafik çizici (dış kütüphane yok) ----------------
  function buildSvgLineChart(opts){
    var w = opts.width, h = opts.height, padding = 22;
    var data = (opts.data || []).filter(function(d){ return d.y != null && !isNaN(d.y); });
    if (data.length < 2) return null;
    var ys = data.map(function(d){ return d.y; });
    var yMin = opts.yMin != null ? opts.yMin : Math.min.apply(null, ys);
    var yMax = opts.yMax != null ? opts.yMax : Math.max.apply(null, ys);
    if (yMin === yMax) { yMin -= 1; yMax += 1; }
    var xStep = (w - padding * 2) / (data.length - 1);
    function xAt(i){ return padding + i * xStep; }
    function yAt(v){ return h - padding - ((v - yMin) / (yMax - yMin)) * (h - padding * 2); }
    var pathD = data.map(function(d, i){ return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ',' + yAt(d.y).toFixed(1); }).join(' ');
    var areaD = pathD + ' L' + xAt(data.length - 1).toFixed(1) + ',' + (h - padding) + ' L' + xAt(0).toFixed(1) + ',' + (h - padding) + ' Z';
    var color = opts.color || '#3b82f6';
    var points = data.map(function(d, i){
      return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(d.y).toFixed(1) + '" r="3" fill="' + color + '"/>';
    }).join('');
    var labels = data.map(function(d, i){
      if (data.length > 8 && i % 2 === 1) return '';
      return '<text x="' + xAt(i).toFixed(1) + '" y="' + (h - 4) + '" font-size="9" fill="#8ea0b3" text-anchor="middle">' + (d.x || '') + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' +
      '<path d="' + areaD + '" fill="' + color + '" fill-opacity="0.14" stroke="none"/>' +
      '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2"/>' +
      points + labels + '</svg>';
  }

  function buildSvgBarChart(opts){
    var w = opts.width, h = opts.height, padding = 20;
    var data = opts.data || [];
    if (!data.length) return null;
    var barW = (w - padding * 2) / data.length * 0.6;
    var gap = (w - padding * 2) / data.length;
    var maxV = opts.max != null ? opts.max : Math.max.apply(null, data.map(function(d){ return d.y || 0; }));
    if (maxV <= 0) maxV = 1;
    var color = opts.color || '#3b82f6';
    var bars = data.map(function(d, i){
      var x = padding + i * gap + (gap - barW) / 2;
      var barH = Math.max(2, ((d.y || 0) / maxV) * (h - padding * 2));
      var y = h - padding - barH;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + barH.toFixed(1) + '" rx="3" fill="' + color + '"/>' +
        '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (h - 4) + '" font-size="9" fill="#8ea0b3" text-anchor="middle">' + (d.x || '') + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' + bars + '</svg>';
  }

  // Bir günün "loglanmış" sayılması için: günlük makro/kilo kaydı VEYA
  // yemek takibi kaydı VEYA antrenman seansı kaydı yeterli.
  function isDayLogged(dateStr, appData, mealData){
    var d = appData && appData.daily && appData.daily[dateStr];
    if (d) {
      var hasAny = ['weight','protein','carbs','fat','water','sleep'].some(function(k){ return d[k] && String(d[k]).trim() !== ''; });
      if (hasAny) return true;
    }
    var w = appData && appData.workouts;
    if (Array.isArray(w) && w.some(function(x){ return x.date === dateStr; })) return true;
    var m = mealData && mealData[dateStr];
    if (m) {
      var anyMeal = ['breakfast','lunch','dinner','snacks'].some(function(k){ return Array.isArray(m[k]) && m[k].length > 0; });
      if (anyMeal) return true;
    }
    return false;
  }

  function computeStreakFromData(appData, mealData){
    var todayStr = fmtDateLocal(new Date());
    var cursor = new Date();
    // Bugün henüz loglanmadıysa, seriyi dünden başlat (bugün henüz "kırılmış" sayılmaz)
    if (!isDayLogged(todayStr, appData, mealData)) {
      cursor.setDate(cursor.getDate() - 1);
    }
    var streak = 0;
    for (var i = 0; i < 365; i++) {
      var dStr = fmtDateLocal(cursor);
      if (isDayLogged(dStr, appData, mealData)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function computeCurrentStreak(){
    var appData, mealData;
    try { appData = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) { appData = null; }
    mealData = mealLogData;
    return computeStreakFromData(appData, mealData);
  }

    var local = email.split('@')[0];
    var namePart = local.split('.')[0].split('_')[0].replace(/[0-9]+$/, '');
    if (!namePart) return 'Sporcu';
    return namePart.charAt(0).toUpperCase() + namePart.slice(1).toLowerCase();
  }

  function computeWeeklyLoggedDaysCount(){
    var appData, mealData;
    try { appData = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) { appData = null; }
    mealData = mealLogData;
    var count = 0;
    var cursor = new Date();
    for (var i = 0; i < 7; i++) {
      if (isDayLogged(fmtDateLocal(cursor), appData, mealData)) count++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return count;
  }

  function computeWeeklyStats(payloadStr){
    var data;
    try { data = JSON.parse(payloadStr); } catch(e) { return null; }
    var week = last7Dates();
    var daily = data.daily || {};
    var targets = data.targets || {};
    var workouts = data.workouts || [];
    var measurements = data.measurements || [];
    var loggedDays = 0, macroPctSum = 0, macroPctCount = 0, suppPctSum = 0, suppPctCount = 0;
    var latestWeight = null, weightDate = null;
    var weightSeries = [], macroPctSeries = [];
    week.forEach(function(dateStr){
      var dayLabel = dateStr.slice(5); // "MM-DD"
      var d = daily[dateStr];
      if (!d) { weightSeries.push({x:dayLabel,y:null}); macroPctSeries.push({x:dayLabel,y:null}); return; }
      loggedDays++;
      if (d.weight) { latestWeight = d.weight; weightDate = dateStr; }
      weightSeries.push({ x: dayLabel, y: d.weight ? parseFloat(d.weight) : null });
      var dayMacroSum = 0, dayMacroCount = 0;
      ['protein','carbs','fat'].forEach(function(k){
        var val = parseFloat(d[k]);
        var target = parseFloat(targets[k]);
        if (!isNaN(val) && target > 0) {
          var pct = Math.min(val / target, 1.2);
          macroPctSum += pct; macroPctCount++;
          dayMacroSum += pct; dayMacroCount++;
        }
      });
      macroPctSeries.push({ x: dayLabel, y: dayMacroCount ? Math.round((dayMacroSum/dayMacroCount)*100) : null });
      if (d.supplements && typeof d.supplements === 'object') {
        var keys = Object.keys(d.supplements);
        if (keys.length) {
          var taken = keys.filter(function(k){ return d.supplements[k]; }).length;
          suppPctSum += taken / keys.length;
          suppPctCount++;
        }
      }
    });
    if (latestWeight == null && measurements.length) {
      var last = measurements[measurements.length - 1];
      latestWeight = last.weight; weightDate = last.date;
    }
    var workoutsThisWeek = workouts.filter(function(w){ return week.indexOf(w.date) !== -1; }).length;
    return {
      loggedDays: loggedDays, totalDays: 7,
      macroAdherencePct: macroPctCount ? Math.round((macroPctSum / macroPctCount) * 100) : null,
      supplementAdherencePct: suppPctCount ? Math.round((suppPctSum / suppPctCount) * 100) : null,
      workoutsThisWeek: workoutsThisWeek,
      latestWeight: latestWeight, weightDate: weightDate,
      hasProgram: Array.isArray(data.programs) && data.programs.length > 0,
      weightSeries: weightSeries, macroPctSeries: macroPctSeries
    };
  }

        if (!doc.data || !doc.data.payload) { renderReportRow(doc.id, label, null, note); return; }
        var stats = computeWeeklyStats(doc.data.payload);
        if (stats) {
          try {
            var parsedPayload = JSON.parse(doc.data.payload);
            stats.streak = computeStreakFromData(parsedPayload, doc.data.mealLog || {});
          } catch(e) { stats.streak = null; }
        }
        renderReportRow(doc.id, label, stats, note);
      });
    }).catch(function(e){
      reportLoadingEl.style.display = 'none';
      reportErrorEl.textContent = 'Rapor alınamadı: ' + e.message;
    });
  }

  // ---------------- Güvenlik kilidi (boş veriyle ezmeyi engelleme) ----------------
  function looksLikeEmptyDefault(jsonStr){
    try {
      var d = JSON.parse(jsonStr);
      var programsEmpty = !Array.isArray(d.programs) || d.programs.length === 0;
      var measurementsEmpty = !Array.isArray(d.measurements) || d.measurements.length === 0;
      var workoutsEmpty = !Array.isArray(d.workouts) || d.workouts.length === 0;
      var dailyEmpty = !d.daily || Object.keys(d.daily).length === 0;
      return programsEmpty && measurementsEmpty && workoutsEmpty && dailyEmpty;
    } catch (e) { return false; }
  }
  function programsSuspiciouslyWiped(jsonStr){
    if (!hadNonEmptyProgramsAtLoad) return false;
    try {
      var d = JSON.parse(jsonStr);
      return !Array.isArray(d.programs) || d.programs.length === 0;
    } catch (e) { return false; }
  }
  function shouldBlockSync(current){
    return (docExistsAtLoad && looksLikeEmptyDefault(current)) || programsSuspiciouslyWiped(current);
  }

  function startSyncLoop(uid){
    function syncNow(){
      var current = localStorage.getItem(STORAGE_KEY);
      if (current && current !== lastSavedValue) {
        if (shouldBlockSync(current)) {
          console.warn('[TT-GÜVENLİK] Şüpheli boş veri tespit edildi, Firestore\'a YAZILMADI (gerçek veri korunuyor).');
          return;
        }
        lastSavedValue = current;
        fsSetDocMerge(uid, { payload: current, updatedAt: new Date().toISOString() })
          .then(function(){ showSaveToast(); })
          .catch(function(e){ console.error('sync error', e); });
      }
    }
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(syncNow, 4000);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') syncNow();
    });
    window.addEventListener('beforeunload', syncNow);
  }

  // ---- Paylaşımlı (herkese açık) özel yemek listesi ----
  var SHARED_FOODS_PATH = 'sharedData/customFoods';
  var sharedCustomFoods = [];

  function loadSharedFoods(){
    return fsGetDocByPath(SHARED_FOODS_PATH).then(function(result){
      sharedCustomFoods = (result.exists && result.data && Array.isArray(result.data.items)) ? result.data.items : [];
    }).catch(function(e){
      console.warn('[TT] Ortak yemek listesi alınamadı (henüz kimse eklememiş olabilir):', e.message);
      sharedCustomFoods = [];
    });
  }

  function saveFoodToSharedList(foodEntry){
    var lower = foodEntry.name.toLocaleLowerCase('tr');
    var already = sharedCustomFoods.some(function(f){ return f.name.toLocaleLowerCase('tr') === lower; });
    if (already) return Promise.resolve();
    sharedCustomFoods.push(foodEntry);
    return fsSetDocMergeByPath(SHARED_FOODS_PATH, { items: sharedCustomFoods }).catch(function(e){
      console.warn('[TT] Ortak yemek listesine kaydedilemedi:', e.message);
    });
  }

  function allSearchableFoods(){
    return TT_FOOD_DB.concat(sharedCustomFoods);
  }

  function mealTodayStr(){
    var d = new Date();
    var p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }

  function mealYesterdayStr(){
    var d = new Date();
    d.setDate(d.getDate() - 1);
    var p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }

  // Son 14 günde en çok/en son eklenen yemekleri döner (tekrar aramadan
  // tek dokunuşla ekleyebilmek için).
  function getRecentFoods(limit){
    var dates = Object.keys(mealLogData).sort().reverse().slice(0, 14);
    var seen = {};
    var out = [];
    dates.forEach(function(dateKey){
      var bucket = mealLogData[dateKey];
      ['breakfast','lunch','dinner','snacks'].forEach(function(mk){
        (bucket[mk] || []).forEach(function(entry){
          var key = entry.name.toLocaleLowerCase('tr');
          if (seen[key]) return;
          seen[key] = true;
          out.push(entry);
        });
      });
    });
    return out.slice(0, limit || 8);
  }

  function getTodayMealBucket(){
    var key = mealTodayStr();
    if (!mealLogData[key]) mealLogData[key] = { breakfast:[], lunch:[], dinner:[], snacks:[] };
    ['breakfast','lunch','dinner','snacks'].forEach(function(k){
      if (!Array.isArray(mealLogData[key][k])) mealLogData[key][k] = [];
    });
    return mealLogData[key];
  }

  function saveMealLogToStorage(){
    try { localStorage.setItem(MEAL_STORAGE_KEY, JSON.stringify(mealLogData)); } catch(e){}
  }

  function computeTotals(entries){
    var t = { kcal:0, protein:0, carbs:0, fat:0 };
    entries.forEach(function(e){
      t.kcal += e.kcal || 0; t.protein += e.protein || 0;
      t.carbs += e.carbs || 0; t.fat += e.fat || 0;
    });
    return t;
  }

  function computeDayTotals(){
    var bucket = getTodayMealBucket();
    var all = bucket.breakfast.concat(bucket.lunch, bucket.dinner, bucket.snacks);
    return computeTotals(all);
  }

  function setReactInputValue(input, value){
    try {
      var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
      setter.call(input, value);
      var ev = new Event('input', { bubbles: true });
      input.dispatchEvent(ev);
    } catch(e){}
  }

  function syncTotalsIntoAppMacroInputs(){
    var totals = computeDayTotals();
    var cards = document.querySelectorAll('.tt-card');
    cards.forEach(function(card){
      var titleLead = card.querySelector('.tt-card-title-lead');
      if (!titleLead || titleLead.textContent.indexOf('MACROS') === -1) return;
      var fields = card.querySelectorAll('.tt-field');
      fields.forEach(function(field){
        var label = field.querySelector('label');
        var input = field.querySelector('input');
        if (!label || !input) return;
        var t = label.textContent;
        if (t.indexOf('Protein') !== -1) setReactInputValue(input, totals.protein ? Math.round(totals.protein) : '');
        else if (t.indexOf('Carbs') !== -1) setReactInputValue(input, totals.carbs ? Math.round(totals.carbs) : '');
        else if (t.indexOf('Fat') !== -1) setReactInputValue(input, totals.fat ? Math.round(totals.fat) : '');
      });
    });
  }

  function mealLabel(key){
    return { breakfast:'Kahvaltı', lunch:'Öğle', dinner:'Akşam', snacks:'Ara Öğün / Diğer' }[key] || key;
  }

  function updateDayTotalsDisplay(){
    var day = computeDayTotals();
    var el = document.getElementById('tt-meal-daytotals');
    if (el) el.textContent = 'Bugünkü toplam: ' + Math.round(day.kcal) + ' kcal · Protein ' + Math.round(day.protein) + 'g · Carbs ' + Math.round(day.carbs) + 'g · Fat ' + Math.round(day.fat) + 'g';
  }

  // Bir öğün bölümünü (başlık + liste + arama + özel ekleme) baştan
  // sona kendi kapalı (closure) durumuyla inşa eder.
  function buildMealSectionDOM(mealKey){
    var section = document.createElement('div');
    section.className = 'tt-meal-section';

    var title = document.createElement('div');
    title.className = 'tt-meal-section-title';
    var titleText = document.createElement('span');
    titleText.textContent = mealLabel(mealKey);
    var subtotalSpan = document.createElement('span');
    subtotalSpan.className = 'tt-meal-section-subtotal';
    title.appendChild(titleText);
    title.appendChild(subtotalSpan);
    section.appendChild(title);

    var entriesDiv = document.createElement('div');
    section.appendChild(entriesDiv);

    var recentDiv = document.createElement('div');
    recentDiv.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;';
    section.appendChild(recentDiv);

    var searchInput = document.createElement('input');
    searchInput.className = 'tt-meal-search-input';
    searchInput.placeholder = 'Yemek ara (örn. tavuk, yumurta)...';
    section.appendChild(searchInput);

    var resultsDiv = document.createElement('div');
    section.appendChild(resultsDiv);

    var qtyRow = document.createElement('div');
    qtyRow.className = 'tt-meal-qty-row';
    var qtyInput = document.createElement('input');
    qtyInput.type = 'number'; qtyInput.step = '0.5';
    qtyInput.className = 'tt-meal-qty-input';
    var qtyUnitSpan = document.createElement('span');
    qtyUnitSpan.style.cssText = 'align-self:center; font-size:12px; color:#8ea0b3; white-space:nowrap;';
    var addBtn = document.createElement('button');
    addBtn.className = 'tt-meal-add-btn';
    addBtn.textContent = 'Ekle';
    qtyRow.appendChild(qtyInput);
    qtyRow.appendChild(qtyUnitSpan);
    qtyRow.appendChild(addBtn);
    section.appendChild(qtyRow);

    var customToggle = document.createElement('button');
    customToggle.className = 'tt-meal-custom-toggle';
    customToggle.textContent = '+ Kendi yemeğini ekle';
    section.appendChild(customToggle);

    var customForm = document.createElement('div');
    customForm.className = 'tt-meal-custom-form';
    var nameInput = document.createElement('input');
    nameInput.placeholder = 'Yemek adı';
    nameInput.style.cssText = 'width:100%; box-sizing:border-box; margin-bottom:6px;';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:6px; margin-bottom:6px;';
    var kcalInput = document.createElement('input'); kcalInput.type='number'; kcalInput.placeholder='kcal'; kcalInput.style.flex='1';
    var proteinInput = document.createElement('input'); proteinInput.type='number'; proteinInput.placeholder='Protein g'; proteinInput.style.flex='1';
    var carbsInput = document.createElement('input'); carbsInput.type='number'; carbsInput.placeholder='Carbs g'; carbsInput.style.flex='1';
    var fatInput = document.createElement('input'); fatInput.type='number'; fatInput.placeholder='Fat g'; fatInput.style.flex='1';
    row.appendChild(kcalInput); row.appendChild(proteinInput); row.appendChild(carbsInput); row.appendChild(fatInput);
    var customAddBtn = document.createElement('button');
    customAddBtn.className = 'tt-meal-add-btn';
    customAddBtn.style.width = '100%';
    customAddBtn.textContent = 'Bu yemeği ekle';
    customForm.appendChild(nameInput);
    customForm.appendChild(row);
    customForm.appendChild(customAddBtn);
    section.appendChild(customForm);

    var selectedFood = null;

    function renderEntries(){
      var bucket = getTodayMealBucket();
      var entries = bucket[mealKey] || [];
      entriesDiv.innerHTML = '';
      if (entries.length === 0) {
        var p = document.createElement('div');
        p.style.cssText = 'font-size:12px; color:#8ea0b3; padding:4px 2px 10px;';
        p.textContent = 'Henüz bir şey eklenmedi.';
        entriesDiv.appendChild(p);
      } else {
        entries.forEach(function(entry, idx){
          var rowEl = document.createElement('div');
          rowEl.className = 'tt-meal-entry-row';
          var qtyTxt = entry.unit === '100g' ? (entry.qty + 'g') : (entry.qty + '× ' + (entry.portionLabel||'porsiyon'));
          rowEl.innerHTML =
            '<div><div style="font-weight:600;">' + entry.name + '</div>' +
            '<div style="color:#8ea0b3; font-size:11px;">' + qtyTxt + ' — ' + Math.round(entry.kcal) + ' kcal · P' + Math.round(entry.protein) + ' C' + Math.round(entry.carbs) + ' F' + Math.round(entry.fat) + '</div></div>';
          var delBtn = document.createElement('button');
          delBtn.textContent = '✕';
          delBtn.style.cssText = 'background:none; border:none; color:#f87171; font-size:15px; cursor:pointer; padding:4px 8px;';
          delBtn.addEventListener('click', function(){
            bucket[mealKey].splice(idx, 1);
            saveMealLogToStorage();
            syncTotalsIntoAppMacroInputs();
            renderEntries();
            updateDayTotalsDisplay();
          });
          rowEl.appendChild(delBtn);
          entriesDiv.appendChild(rowEl);
        });
      }
      var sub = computeTotals(entries);
      subtotalSpan.textContent = Math.round(sub.kcal) + ' kcal · P' + Math.round(sub.protein) + ' C' + Math.round(sub.carbs) + ' F' + Math.round(sub.fat);
    }

    function renderRecentChips(){
      recentDiv.innerHTML = '';
      var recents = getRecentFoods(6);
      recents.forEach(function(entry){
        var chip = document.createElement('button');
        chip.textContent = '+ ' + entry.name;
        chip.style.cssText = 'font-size:11px; padding:6px 10px; border-radius:999px; border:1px solid #2a3644; background:#0d1520; color:#c7d2dd; white-space:nowrap;';
        chip.addEventListener('click', function(){
          var bucket = getTodayMealBucket();
          bucket[mealKey].push({
            name: entry.name, unit: entry.unit, qty: entry.qty, portionLabel: entry.portionLabel || null,
            kcal: entry.kcal, protein: entry.protein, carbs: entry.carbs, fat: entry.fat
          });
          saveMealLogToStorage();
          syncTotalsIntoAppMacroInputs();
          renderEntries();
          updateDayTotalsDisplay();
        });
        recentDiv.appendChild(chip);
      });
    }

    function clearSearchUI(){
      searchInput.value = '';
      resultsDiv.innerHTML = '';
      qtyRow.style.display = 'none';
      selectedFood = null;
    }

    searchInput.addEventListener('input', function(){
      var query = searchInput.value;
      resultsDiv.innerHTML = '';
      if (!query || query.length < 2) return;
      var q = query.toLocaleLowerCase('tr');
      var matches = allSearchableFoods().filter(function(f){ return f.name.toLocaleLowerCase('tr').indexOf(q) !== -1; }).slice(0, 10);
      matches.forEach(function(f){
        var item = document.createElement('div');
        item.className = 'tt-meal-search-item';
        item.textContent = f.name + ' — ' + (f.unit === '100g' ? (f.kcal + ' kcal/100g') : (f.kcal + ' kcal/' + f.portionLabel));
        item.addEventListener('click', function(){
          selectedFood = f;
          searchInput.value = f.name;
          resultsDiv.innerHTML = '';
          qtyRow.style.display = 'flex';
          if (f.unit === '100g') {
            qtyInput.value = 100; qtyInput.placeholder = 'gram'; qtyUnitSpan.textContent = 'gram';
          } else {
            qtyInput.value = 1; qtyInput.placeholder = 'adet'; qtyUnitSpan.textContent = f.portionLabel;
          }
        });
        resultsDiv.appendChild(item);
      });
    });

    addBtn.addEventListener('click', function(){
      if (!selectedFood) return;
      var qty = parseFloat(qtyInput.value);
      if (!qty || qty <= 0) return;
      var factor = selectedFood.unit === '100g' ? (qty/100) : qty;
      var entry = {
        name: selectedFood.name, unit: selectedFood.unit, qty: qty,
        portionLabel: selectedFood.portionLabel || null,
        kcal: selectedFood.kcal*factor, protein: selectedFood.protein*factor,
        carbs: selectedFood.carbs*factor, fat: selectedFood.fat*factor
      };
      var bucket = getTodayMealBucket();
      bucket[mealKey].push(entry);
      saveMealLogToStorage();
      syncTotalsIntoAppMacroInputs();
      clearSearchUI();
      renderEntries();
      updateDayTotalsDisplay();
    });

    customToggle.addEventListener('click', function(){
      var isHidden = (customForm.style.display === 'none' || !customForm.style.display);
      customForm.style.display = isHidden ? 'block' : 'none';
    });

    customAddBtn.addEventListener('click', function(){
      var name = nameInput.value.trim();
      var kcal = parseFloat(kcalInput.value) || 0;
      var protein = parseFloat(proteinInput.value) || 0;
      var carbs = parseFloat(carbsInput.value) || 0;
      var fat = parseFloat(fatInput.value) || 0;
      if (!name || kcal <= 0) return;
      var entry = { name:name, unit:'custom', qty:1, portionLabel:'özel', kcal:kcal, protein:protein, carbs:carbs, fat:fat };
      var bucket = getTodayMealBucket();
      bucket[mealKey].push(entry);
      saveMealLogToStorage();
      syncTotalsIntoAppMacroInputs();
      saveFoodToSharedList({
        id: 'custom-' + Date.now(), name: name, unit: 'portion',
        portionLabel: '1 porsiyon (üye eklemesi)', kcal:kcal, protein:protein, carbs:carbs, fat:fat
      });
      nameInput.value=''; kcalInput.value=''; proteinInput.value=''; carbsInput.value=''; fatInput.value='';
      customForm.style.display = 'none';
      renderEntries();
      updateDayTotalsDisplay();
    });

    renderEntries();
    renderRecentChips();
    return section;
  }

  function renderMealSections(){
    var container = document.getElementById('tt-meal-sections');
    if (!container) return;
    container.innerHTML = '';
    ['breakfast','lunch','dinner','snacks'].forEach(function(key){
      container.appendChild(buildMealSectionDOM(key));
    });
    updateDayTotalsDisplay();
  }

  // "Dünü Kopyala": bugün BOŞ olan öğün kategorilerine dünkü kayıtları
  // kopyalar (bugün zaten dolu olan bir öğünün üzerine yazmaz).
  document.getElementById('tt-copy-yesterday-btn').addEventListener('click', function(){
    var yesterdayKey = mealYesterdayStr();
    var yesterdayBucket = mealLogData[yesterdayKey];
    if (!yesterdayBucket) {
      showSaveToast_customText('Dün için kayıtlı bir şey yok');
      return;
    }
    var today = getTodayMealBucket();
    var copiedAny = false;
    ['breakfast','lunch','dinner','snacks'].forEach(function(mk){
      if ((today[mk] || []).length === 0 && (yesterdayBucket[mk] || []).length > 0) {
        today[mk] = JSON.parse(JSON.stringify(yesterdayBucket[mk]));
        copiedAny = true;
      }
    });
    if (copiedAny) {
      saveMealLogToStorage();
      syncTotalsIntoAppMacroInputs();
      renderMealSections();
      showSaveToast_customText('✓ Dünkü öğünler kopyalandı');
    } else {
      showSaveToast_customText('Zaten bugün için kayıt var, üzerine yazılmadı');
    }
  });

  // "+1 Bardak Su": uygulamanın kendi "Water (L)" kutusunu bulup üzerine
  // 0.25L ekler (React'in kontrollü input'una native setter ile basar).
  document.getElementById('tt-quick-water-btn').addEventListener('click', function(){
    var fields = document.querySelectorAll('.tt-field');
    var waterInput = null;
    fields.forEach(function(field){
      var label = field.querySelector('label');
      if (label && label.textContent.indexOf('Water') !== -1) {
        var inp = field.querySelector('input');
        if (inp) waterInput = inp;
      }
    });
    if (!waterInput) {
      showSaveToast_customText('Su alanı bulunamadı (Today sekmesinde olmalısın)');
      return;
    }
    var current = parseFloat(waterInput.value) || 0;
    setReactInputValue(waterInput, (current + 0.25).toFixed(2));
    showSaveToast_customText('💧 +250ml eklendi');
  });

  var mealTabObserver = null;
  var mealTabInjected = false;

  // GÜVENLİ YÖNTEM: Uygulamanın kendi Today/Train/Progress çubuğunun
  // İÇİNE eklemiyoruz (React kendi çizdiği alanı yeniden render edince
  // bizim eklediğimiz düğümü silip düzeni bozabiliyordu). Bunun yerine,
  // React'in yönetmediği, tamamen bizim kontrolümüzdeki AYRI bir satırı
  // hemen altına ekliyoruz — aynı görünüm, ama asla React tarafından
  // silinmez/bozulmaz.
  function openMealScreen(){
    renderMealSections();
    var header = document.querySelector('.tt-stamp');
    var screen = document.getElementById('tt-meal-screen');
    if (header) {
      var top = header.getBoundingClientRect().bottom;
      screen.style.top = Math.max(top, 0) + 'px';
    }
    screen.style.display = 'block';
  }
  function closeMealScreen(){
    document.getElementById('tt-meal-screen').style.display = 'none';
  }

  // GERÇEK Today/Train/Progress çubuğunu GİZLEYİP yerine tamamen bizim
  // kontrolümüzde, 4 butonlu (2x2) bir kopya koyar. Kopyadaki Today/Train/
  // Progress'e tıklamak gerçek butona .click() gönderir (uygulama normal
  // çalışmaya devam eder); "Yemek"e tıklamak öğün ekranını açar. Hangi
  // sekmenin seçili olduğu HER ZAMAN bizim kopyamızda gösterilir, bu yüzden
  // React'in kendi render'ı hiç karışmaz/bozmaz.
  function injectMealTabIfPossible(){
    if (mealTabInjected) return true;
    var navBars = document.querySelectorAll('.tt-nav');
    for (var i = 0; i < navBars.length; i++) {
      var realNav = navBars[i];
      if (realNav.style.display === 'none') continue; // zaten değiştirilmiş
      var realButtons = realNav.querySelectorAll('.tt-navbtn');
      if (!realButtons.length) continue;

      var grid = document.createElement('div');
      grid.className = realNav.className + ' tt-own-nav-grid';
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = '1fr 1fr';
      grid.style.gap = '6px';

      var ownButtons = [];
      function makeOwnButton(text, realBtn){
        var btn = document.createElement('button');
        btn.className = (realBtn ? realBtn.className : realButtons[0].className).replace(/\bactive\b/,'').trim();
        btn.textContent = text;
        btn.addEventListener('click', function(){
          ownButtons.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          if (realBtn) {
            closeMealScreen();
            realBtn.click();
            if (text.indexOf('Progress') !== -1) injectProgressChart();
            if (text.indexOf('Today') !== -1) { injectGreetingCard(); injectStreakBadge(); }
          } else {
            openMealScreen();
          }
        });
        ownButtons.push(btn);
        grid.appendChild(btn);
        return btn;
      }

      var activeRealIdx = -1;
      realButtons.forEach(function(realBtn, idx){
        if (realBtn.classList.contains('active')) activeRealIdx = idx;
        makeOwnButton(realBtn.textContent, realBtn);
      });
      makeOwnButton('Yemek', null);

      if (activeRealIdx === -1) activeRealIdx = 0;
      ownButtons[activeRealIdx].classList.add('active');
      // Uygulama ilk açıldığında zaten Today sekmesindeyse (varsayılan),
      // streak rozetini hemen ekle — kullanıcı ayrıca tıklamasa bile görünsün.
      if (ownButtons[activeRealIdx].textContent.indexOf('Today') !== -1) {
        injectGreetingCard();
        injectStreakBadge();
      }

      realNav.style.display = 'none';
      realNav.parentNode.insertBefore(grid, realNav);
      mealTabInjected = true;
      return true;
    }
    return false;
  }

  function enableMealFeature(){
    mealTabInjected = false;
    if (injectMealTabIfPossible()) return;
    if (mealTabObserver) mealTabObserver.disconnect();
    mealTabObserver = new MutationObserver(function(){
      if (injectMealTabIfPossible() && mealTabObserver) {
        mealTabObserver.disconnect();
        mealTabObserver = null;
      }
    });
    var rootEl = document.getElementById('root');
    if (rootEl) mealTabObserver.observe(rootEl, { childList: true, subtree: true });
  }
  function disableMealFeature(){
    if (mealTabObserver) { mealTabObserver.disconnect(); mealTabObserver = null; }
    mealTabInjected = false;
    var oldGrid = document.querySelector('.tt-own-nav-grid');
    if (oldGrid) oldGrid.remove();
    closeMealScreen();
  }

  function startMealSyncLoop(uid){
    function syncMealNow(){
      var current = JSON.stringify(mealLogData);
      if (current !== mealLastSavedValue) {
        mealLastSavedValue = current;
        fsSetDocMerge(uid, { mealLog: mealLogData, mealLogUpdatedAt: new Date().toISOString() })
          .catch(function(e){ console.error('meal sync error', e); });
      }
    }
    if (mealSyncTimer) clearInterval(mealSyncTimer);
    mealSyncTimer = setInterval(syncMealNow, 5000);
    window.addEventListener('beforeunload', syncMealNow);
  }


  // Kaydırdıkça küçülen başlık (sticky header shrink). Uygulamanın kendi
  // başlık bloğu (.tt-stamp) React tarafından yönetiliyor ama üzerine
  // sadece "transform/opacity" gibi React'in dokunmadığı stil özellikleri
  // uyguladığımız için güvenli — React yeniden render etse bile bu bir
  // sonraki scroll event'inde tekrar hesaplanır.
  window.addEventListener('scroll', function(){
    var stamp = document.querySelector('.tt-stamp');
    if (!stamp) return;
    var y = window.scrollY || window.pageYOffset;
    var shrink = Math.min(Math.max(y / 90, 0), 1);
    var scale = 1 - shrink * 0.22;
    stamp.style.transform = 'scale(' + scale.toFixed(3) + ')';
    stamp.style.transformOrigin = 'top left';
    stamp.style.opacity = String(1 - shrink * 0.1);
    stamp.style.transition = 'transform .08s linear, opacity .08s linear';
  }, { passive: true });

  // ---------------- Açık/Koyu tema ----------------
  var THEME_KEY = 'tt-theme';
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    var icon = theme === 'light' ? '☀️' : '🌙';
    var btn1 = document.getElementById('tt-theme-toggle-btn');
    var btn2 = document.getElementById('tt-theme-toggle-gate-btn');
    if (btn1) btn1.textContent = icon;
    if (btn2) btn2.textContent = icon;
    try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  }
  function toggleTheme(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  }
  document.getElementById('tt-theme-toggle-btn').addEventListener('click', toggleTheme);
  document.getElementById('tt-theme-toggle-gate-btn').addEventListener('click', toggleTheme);
  (function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
    applyTheme(saved === 'light' ? 'light' : 'dark');
  })();

  // ---------------- Başlangıç: kayıtlı oturum var mı kontrol et ----------------
  loadAuthState();
  if (authState.idToken && authState.uid) {
    setLoading(true);
    ensureFreshToken().then(function(){
      handleLoggedIn();
    }).catch(function(){
      clearAuthState();
      gate.style.display = 'flex';
      setLoading(false);
    });
  } else {
    gate.style.display = 'flex';
  }
})();

</script>



<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){
        console.warn('SW kayıt hatası:', e);
      });
    });
  }
</script>
