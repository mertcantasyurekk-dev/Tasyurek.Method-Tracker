<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bağlantı Testi (REST)</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#0d1520; color:#e8edf3; padding:24px; }
  input { display:block; width:100%; max-width:320px; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #2a3644; background:#141d29; color:#fff; box-sizing:border-box; }
  button { padding:10px 16px; border-radius:8px; border:none; background:#3b82f6; color:#fff; font-size:14px; cursor:pointer; }
  pre { background:#141d29; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-all; margin-top:16px; }
  .ok { color:#4ade80; }
  .err { color:#f87171; }
</style>
</head>
<body>

<h2>Firestore REST Bağlantı Testi</h2>
<p>Bu sayfa Firebase SDK'sını HİÇ kullanmıyor — sadece düz <code>fetch()</code> ile Google'ın REST API'lerine istek atıyor. Amaç: WebChannel/SDK bağlantısı değil, düz HTTPS isteklerinin bu ağda çalışıp çalışmadığını görmek.</p>

<input id="email" type="email" placeholder="E-posta" value="mertcan.tasyurekk@gmail.com" />
<input id="pass" type="password" placeholder="Şifre" />
<button id="testBtn">Test Et</button>

<pre id="out">Sonuç burada görünecek...</pre>

<script>
  var API_KEY = "AIzaSyCChH0sUdkOsjLOuti_kc0VPh23I9-h7a8";
  var PROJECT_ID = "tasyurekmethod-tracker";
  var out = document.getElementById('out');

  function log(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    out.appendChild(line);
  }

  document.getElementById('testBtn').addEventListener('click', async function() {
    out.innerHTML = '';
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;

    // 1) REST ile giriş yap (Identity Toolkit REST API)
    log('1) Giriş isteği gönderiliyor (REST)...');
    var idToken, localId;
    try {
      var t0 = performance.now();
      var authRes = await fetch(
        'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: pass, returnSecureToken: true })
        }
      );
      var authData = await authRes.json();
      var t1 = performance.now();
      if (!authRes.ok) {
        log('❌ Giriş BAŞARISIZ (' + Math.round(t1-t0) + 'ms): ' + JSON.stringify(authData), 'err');
        return;
      }
      idToken = authData.idToken;
      localId = authData.localId;
      log('✅ Giriş BAŞARILI (' + Math.round(t1-t0) + 'ms). UID=' + localId, 'ok');
    } catch (e) {
      log('❌ Giriş isteği ağ hatası: ' + e.message, 'err');
      log('Bu, ağın identitytoolkit.googleapis.com adresine dahi ulaşamadığı anlamına gelir.', 'err');
      return;
    }

    // 2) REST ile Firestore'dan belge oku
    log('2) Firestore belgesi REST ile okunuyor...');
    try {
      var t2 = performance.now();
      var docUrl = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID +
                   '/databases/default/documents/userdata/' + localId;
      var docRes = await fetch(docUrl, {
        headers: { 'Authorization': 'Bearer ' + idToken }
      });
      var docData = await docRes.json();
      var t3 = performance.now();
      if (!docRes.ok) {
        log('❌ Firestore okuma BAŞARISIZ (' + Math.round(t3-t2) + 'ms): ' + JSON.stringify(docData), 'err');
        return;
      }
      log('✅ Firestore okuma BAŞARILI (' + Math.round(t3-t2) + 'ms)!', 'ok');
      var fields = docData.fields || {};
      var fieldNames = Object.keys(fields);
      log('Belgedeki alanlar: ' + fieldNames.join(', '));
      if (fields.payload) {
        var payloadStr = fields.payload.stringValue || '';
        log('payload uzunluğu: ' + payloadStr.length + ' karakter');
        log('payload önizleme: ' + payloadStr.substring(0, 150));
      } else {
        log('⚠️ payload alanı bu belgede yok.', 'err');
      }
      log('--- TAM YANIT ---');
      log(JSON.stringify(docData, null, 2));
    } catch (e) {
      log('❌ Firestore isteği ağ hatası: ' + e.message, 'err');
      log('Bu, ağın firestore.googleapis.com adresine dahi ulaşamadığı anlamına gelir.', 'err');
    }
  });
</script>

</body>
</html>
