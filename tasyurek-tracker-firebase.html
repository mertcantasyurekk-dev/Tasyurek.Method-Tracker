<!-- ===== TT-AUTH: login gate overlay ===== -->
<div id="tt-auth-gate" style="
  position:fixed; inset:0; z-index:99999; background:#0d1520;
  display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#e8edf3;">
  <div style="width:100%; max-width:340px; padding:28px; box-sizing:border-box;">
    <h1 style="font-size:20px; font-weight:600; margin:0 0 4px;">Tasyurek Tracker</h1>
    <p id="tt-auth-sub" style="font-size:13px; color:#8ea0b3; margin:0 0 20px;">Devam etmek için giriş yap</p>

    <input id="tt-email" type="email" placeholder="E-posta" autocomplete="username"
      style="width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:15px;" />
    <input id="tt-pass" type="password" placeholder="Şifre" autocomplete="current-password"
      style="width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:14px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:15px;" />

    <button id="tt-login-btn"
      style="width:100%; padding:13px; border:none; border-radius:10px; background:#3b82f6; color:white; font-size:15px; font-weight:600; margin-bottom:10px;">Giriş yap</button>

    <p id="tt-auth-error" style="color:#f87171; font-size:13px; margin-top:14px; min-height:16px;"></p>
    <p id="tt-auth-loading" style="color:#8ea0b3; font-size:13px; margin-top:6px; display:none;">Yükleniyor...</p>
  </div>
</div>

<button id="tt-logout-btn" style="
  display:none; position:fixed; top:8px; right:8px; z-index:99998;
  background:rgba(20,29,41,0.85); color:#8ea0b3; border:1px solid #2a3644;
  border-radius:8px; padding:6px 10px; font-size:12px; font-family:-apple-system,sans-serif;">Çıkış</button>

<button id="tt-switch-btn" style="
  display:none; position:fixed; top:8px; left:8px; z-index:99998;
  background:rgba(59,130,246,0.9); color:white; border:none;
  border-radius:8px; padding:6px 10px; font-size:12px; font-family:-apple-system,sans-serif;">👤 Üye Değiştir</button>

<div id="tt-edit-banner" style="
  display:none; position:fixed; top:0; left:0; right:0; z-index:99997;
  background:#f59e0b; color:#1a1200; text-align:center; font-size:12px;
  font-family:-apple-system,sans-serif; padding:4px 60px;"></div>

<!-- ===== TT-AUTH: admin member picker ===== -->
<div id="tt-member-picker" style="
  display:none; position:fixed; inset:0; z-index:99996; background:#0d1520;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#e8edf3; overflow-y:auto;">
  <div style="max-width:420px; margin:0 auto; padding:28px 20px;">
    <h1 style="font-size:20px; font-weight:600; margin:0 0 4px;">Yönetici Paneli</h1>
    <p style="font-size:13px; color:#8ea0b3; margin:0 0 20px;">Düzenlemek istediğin üyeyi seç</p>
    <div style="margin-bottom:14px;">
      <button id="tt-own-data-btn" style="
        width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid #3b82f6;
        background:rgba(59,130,246,0.15); color:#e8edf3; font-size:14px; margin-bottom:8px;">
        ⭐ Kendi verim (koç)
      </button>
    </div>
    <p id="tt-picker-loading" style="font-size:13px; color:#8ea0b3;">Üyeler yükleniyor...</p>
    <div id="tt-member-list"></div>
    <p id="tt-picker-error" style="color:#f87171; font-size:13px; margin-top:14px;"></p>
  </div>
</div>

<div id="root"></div>

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var gate = document.getElementById('tt-auth-gate');
  var errEl = document.getElementById('tt-auth-error');

  var memberListEl = document.getElementById('tt-member-list');
  var appStarted = false;
  var syncTimer = null;
  var lastSavedValue = null;
  var currentAuthUid = null;   // giriş yapan kişi

    var inert = document.getElementById('tt-app-bundle');
    var s = document.createElement('script');
    s.text = inert.textContent;
    document.body.appendChild(s);
  }

  function showAppFor(uid, label){
    currentEditUid = uid;
    setLoading(true);
    db.collection('userdata').doc(uid).get().then(function(doc){
      if (doc.exists && doc.data().payload) {
        localStorage.setItem(STORAGE_KEY, doc.data().payload);
        lastSavedValue = doc.data().payload;
      } else {
        localStorage.removeItem(STORAGE_KEY); // farklı üyeye geçince eski veriyle karışmasın
        lastSavedValue = null;
      }
      setLoading(false);
      gate.style.display = 'none';
      picker.style.display = 'none';
      logoutBtn.style.display = 'block';
      if (isAdmin) {
        switchBtn.style.display = 'block';
        editBanner.style.display = 'block';
        editBanner.textContent = 'Düzenleniyor: ' + label;
      }
      startApp();
      startSyncLoop(uid);
    }).catch(function(e){
      setLoading(false);
      showError('Veri alınamadı: ' + e.message);
    });
  }

  // Yönetici: tüm üyeleri listele
  function showMemberPicker(){
    gate.style.display = 'none';
    picker.style.display = 'block';
    pickerLoading.style.display = 'block';
    pickerError.textContent = '';
    memberListEl.innerHTML = '';
    db.collection('userdata').get().then(function(snap){
      pickerLoading.style.display = 'none';
      snap.forEach(function(doc){
        if (doc.id === currentAuthUid) return; // "kendi verim" butonu zaten var
        var data = doc.data();
        var label = data.email || doc.id;
        var btn = document.createElement('button');
        btn.textContent = label;
        btn.style.cssText = "width:100%; text-align:left; padding:13px 14px; border-radius:10px; border:1px solid #2a3644; background:#141d29; color:#e8edf3; font-size:14px; margin-bottom:8px;";
        btn.addEventListener('click', function(){ showAppFor(doc.id, label); });
        memberListEl.appendChild(btn);
      });
      if (memberListEl.children.length === 0) {
        var p = document.createElement('p');
        p.style.cssText = "font-size:13px; color:#8ea0b3;";
        p.textContent = "Henüz hiç üye giriş yapmadı. Bir üye ilk kez giriş yaptığında burada görünecek.";
        memberListEl.appendChild(p);
      }
    }).catch(function(e){
      pickerLoading.style.display = 'none';
      pickerError.textContent = 'Üyeler alınamadı: ' + e.message;
    });
  }

  // Değişiklikleri periyodik olarak Firestore'a yazar (currentEditUid'e yazar)
  function startSyncLoop(uid){
    function syncNow(){
      var current = localStorage.getItem(STORAGE_KEY);
      if (current && current !== lastSavedValue) {
        lastSavedValue = current;
        db.collection('userdata').doc(uid).set({
          payload: current,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(function(e){ console.error('sync error', e); });
      }
    }
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(syncNow, 4000);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') syncNow();
    });
    window.addEventListener('beforeunload', syncNow);
  }

  document.getElementById('tt-login-btn').addEventListener('click', function(){
    showError('');
    auth.signInWithEmailAndPassword(emailEl.value.trim(), passEl.value)
      .catch(function(e){ showError(e.message); });
  });

  document.getElementById('tt-own-data-btn').addEventListener('click', function(){
    showAppFor(currentAuthUid, auth.currentUser.email + ' (kendi verin)');
  });

  switchBtn.addEventListener('click', function(){
    if (syncTimer) clearInterval(syncTimer);
    var current = localStorage.getItem(STORAGE_KEY);
    if (current && currentEditUid) {
      db.collection('userdata').doc(currentEditUid).set({
        payload: current, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    location.reload(); // en temizi: sayfayı yenileyip picker'a dön
  });

  logoutBtn.addEventListener('click', function(){
    if (syncTimer) clearInterval(syncTimer);
    var current = localStorage.getItem(STORAGE_KEY);
    var uid = currentEditUid;
    var doFinally = function(){ auth.signOut().then(function(){ location.reload(); }); };
    if (uid && current) {
      db.collection('userdata').doc(uid).set({
        payload: current, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(doFinally).catch(doFinally);
    } else { doFinally(); }
  });

  auth.onAuthStateChanged(function(user){
    if (user) {
      currentAuthUid = user.uid;
      isAdmin = (user.email === ADMIN_EMAIL);
      // Her giriş yapan, kendi belgesinde kayıtlı olsun (admin panosunda görünmesi için)
      db.collection('userdata').doc(user.uid).set({
        email: user.email
      }, { merge: true });

      if (isAdmin) {
        showMemberPicker();
      } else {
        showAppFor(user.uid, user.email);
      }
    } else {
      appStarted = false;
      gate.style.display = 'flex';
      picker.style.display = 'none';
      logoutBtn.style.display = 'none';
      switchBtn.style.display = 'none';
      editBanner.style.display = 'none';
    }
  });
})();
</script>
